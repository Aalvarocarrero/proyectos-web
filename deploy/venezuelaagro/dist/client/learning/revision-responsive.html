<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Revisión de tamaños · Finca Escuela</title><style>body{margin:0;background:#e7eddd;color:#294930;font:14px system-ui}header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{min-height:44px;padding:10px 16px;border:1px solid #b8c9a4;border-radius:9px;background:#fff;color:inherit;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#294930;color:white}p{padding:0 16px;margin:0 0 16px;font-size:12px}main{padding:0 16px 24px;overflow:auto}iframe{display:block;width:390px;height:900px;background:#f7f8ef;border:2px solid #bacaa8;border-radius:15px;margin:auto;box-shadow:0 12px 25px #20391316}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #c88742;outline-offset:3px}</style></head><body><header><strong>Revisión de diseño adaptable</strong><button data-width="390" aria-pressed="true">390 px · estrecho</button><button data-width="768" aria-pressed="false">768 px · mediano</button><button data-width="1180" aria-pressed="false">1180 px · amplio</button><a href="/juego-finca">Abrir el juego</a></header><p>Este marco permite revisar el ancho CSS real del juego. No simula hardware, gestos táctiles ni un dispositivo móvil físico.</p><main><iframe id="review-frame" src="/learning/finca-escuela.html" title="Finca Escuela en un marco de 390 píxeles"></iframe></main><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{const width=Number(button.dataset.width);const frame=document.getElementById('review-frame');frame.style.width=width+'px';frame.title='Finca Escuela en un marco de '+width+' píxeles';document.querySelectorAll('[data-width]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));}));</script></body></html>
