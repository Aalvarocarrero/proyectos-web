<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Menú y primer acceso</title><desc id="desc">Esquema didáctico de campos de Venezuela Agro. Datos de ejemplo.</desc><rect width="960" height="640" rx="24" fill="#ebe2d3"/><g font-family="system-ui, sans-serif"><rect x="42" y="38" width="876" height="562" rx="22" fill="#fffdf7"/><path d="M64 38H896Q918 38 918 60V96H42V60Q42 38 64 38" fill="#211d1a"/><circle cx="72" cy="67" r="4" fill="#b7d79a"/><text x="88" y="73" font-size="18" font-weight="600" fill="#fffdf7">Venezuela Agro</text><text x="714" y="73" font-size="12" fill="#b7d79a">ESQUEMA DIDÁCTICO</text><text x="78" y="145" font-family="Georgia,serif" font-size="27" fill="#3e2a19">Menú y primer acceso</text><text x="78" y="171" font-size="12" fill="#6f665c">Orientación del proceso · No es una captura de pantalla</text><text x="94" y="202" font-size="14" fill="#6f665c">Accesos principales</text><rect x="78" y="211" width="536" height="35" rx="9" fill="#f5f1e9" stroke="#e3dccf"/><text x="94" y="234" font-size="15" fill="#3e2a19">Mi finca · Mercado Agro · Profesionales</text><text x="94" y="267" font-size="14" fill="#6f665c">También a mano</text><rect x="78" y="276" width="536" height="35" rx="9" fill="#f5f1e9" stroke="#e3dccf"/><text x="94" y="299" font-size="15" fill="#3e2a19">Aprende · Comunidad</text><text x="94" y="332" font-size="14" fill="#6f665c">Menú agrupado</text><rect x="78" y="341" width="536" height="35" rx="9" fill="#f5f1e9" stroke="#e3dccf"/><text x="94" y="364" font-size="15" fill="#3e2a19">Gestionar · Comprar y buscar apoyo · Participar</text><text x="94" y="397" font-size="14" fill="#6f665c">Estado de red</text><rect x="78" y="406" width="536" height="35" rx="9" fill="#f5f1e9" stroke="#e3dccf"/><text x="94" y="429" font-size="15" fill="#3e2a19">Icono Wi-Fi / Conexión en la cabecera</text><rect x="78" y="463" width="240" height="38" rx="19" fill="#3e2a19"/><text x="198" y="488" text-anchor="middle" font-size="13" fill="#fffdf7">Abre la herramienta real</text><rect x="652" y="192" width="222" height="184" rx="16" fill="#edf1e5"/><circle cx="684" cy="222" r="11" fill="#4c6b3a"/><path d="M679 222l4 4 7-8" fill="none" stroke="white" stroke-width="2"/><text x="672" y="261" font-size="15" font-weight="600" fill="#3e2a19">Paso a paso</text><text x="672" y="290" font-size="13" fill="#5f574f">1. Elige el área</text><text x="672" y="315" font-size="13" fill="#5f574f">2. Sigue las indicaciones</text><text x="672" y="340" font-size="13" fill="#5f574f">3. Comprueba el resultado</text><text x="652" y="419" font-size="12" fill="#5f574f">Misma plataforma en móvil,</text><text x="652" y="440" font-size="12" fill="#5f574f">tablet y computador.</text><text x="78" y="586" font-size="11" fill="#6f665c">Creado por Alimentos Parcela Los Morochos · Ilustración orientativa</text></g></svg>